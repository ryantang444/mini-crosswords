<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projects &mdash; Ryan</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header class="site">
      <a class="back" href="../">&larr; home</a>
      <h1>Projects</h1>
      <p>Things I've built.</p>
    </header>

    <ul class="project-grid" id="grid"></ul>
    <p class="empty" id="empty" hidden>No projects yet. Add an entry to <code>data.json</code> and drop a photo in <code>photos/</code>.</p>
    <p class="error" id="error" hidden></p>
  </main>

  <script>
  (async function () {
    const grid = document.getElementById('grid');
    const empty = document.getElementById('empty');
    const errorEl = document.getElementById('error');

    try {
      const res = await fetch('data.json', { cache: 'no-store' });
      if (!res.ok) throw new Error('Could not load data.json (' + res.status + ')');
      const projects = await res.json();

      if (!Array.isArray(projects) || projects.length === 0) {
        empty.hidden = false;
        return;
      }

      projects.forEach(p => {
        const primaryHref = p.link || p.github || '#';

        const li = document.createElement('li');
        li.className = 'project-card';

        const thumb = document.createElement('a');
        thumb.className = 'thumb';
        thumb.href = primaryHref;
        const img = document.createElement('img');
        img.src = p.image || 'photos/placeholder.svg';
        img.alt = p.title || '';
        img.loading = 'lazy';
        thumb.appendChild(img);

        const body = document.createElement('div');
        body.className = 'body';

        const h2 = document.createElement('h2');
        const titleLink = document.createElement('a');
        titleLink.href = primaryHref;
        titleLink.textContent = p.title || 'Untitled';
        h2.appendChild(titleLink);

        const blurb = document.createElement('p');
        blurb.textContent = p.blurb || '';

        const links = document.createElement('div');
        links.className = 'links';
        if (p.link) {
          const a = document.createElement('a');
          a.href = p.link;
          a.textContent = 'Visit ↗';
          links.appendChild(a);
        }
        if (p.github) {
          const a = document.createElement('a');
          a.href = p.github;
          a.textContent = 'GitHub ↗';
          links.appendChild(a);
        }

        body.appendChild(h2);
        body.appendChild(blurb);
        if (links.children.length) body.appendChild(links);

        li.appendChild(thumb);
        li.appendChild(body);
        grid.appendChild(li);
      });
    } catch (e) {
      errorEl.hidden = false;
      errorEl.textContent = e.message;
    }
  })();
  </script>
</body>
</html>
